name: Web security and build

on:
  pull_request:
    branches: [Master]
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify MCP SDK is patched
        run: node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/@modelcontextprotocol/sdk']?.version; if(v!=='1.32.1'){ console.error('MCP SDK not patched:',v); process.exit(1) }"
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js studio
        run: npm run build
      - name: npm vulnerability report (informational while upstream lacks braces fix)
        run: npm audit --audit-level=high
        continue-on-error: true

